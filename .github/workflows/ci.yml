name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group lint
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group test --no-default-groups
      - run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          files: coverage.xml
        continue-on-error: true

  lowest-deps:
    name: test (lowest dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv run --isolated --resolution lowest-direct --group test --no-default-groups pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl plakakia --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
