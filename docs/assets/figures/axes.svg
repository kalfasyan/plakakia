<svg class="plk-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Tiling a hyperspectral cube along chosen axes">
<title>Tiling a hyperspectral cube along chosen axes</title>
<style>
.fg{fill:var(--md-default-fg-color,#222)}
.mut{fill:var(--md-default-fg-color--light,#666)}
.ln{stroke:var(--md-default-fg-color--light,#666);fill:none}
.bg{fill:var(--md-default-fg-color--lightest,#eee)}
text{font-family:var(--md-text-font-family,sans-serif);font-size:14px}
.sm{font-size:12px}.b{font-weight:700}.mono{font-family:var(--md-code-font-family,monospace)}
</style>
<text class="fg b mono" x="30" y="28">axes=(0, 1)</text>
<text class="mut sm" x="30" y="46">spatial tiles, all bands</text>
<polygon points="30,110 102.0,56.0 252.0,56.0 180,110" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.08"/><polygon points="180,110 252.0,56.0 252.0,206.0 180,260" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.05"/><polygon points="30,110 180,110 180,260 30,260" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.12"/>
<polygon points="30,110 102.0,56.0 177.0,56.0 105.0,110" fill="#009688" stroke="#009688" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.32"/><polygon points="105.0,110 177.0,56.0 177.0,131.0 105.0,185.0" fill="#009688" stroke="#009688" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.20"/><polygon points="30,110 105.0,110 105.0,185.0 30,185.0" fill="#009688" stroke="#009688" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.45"/>
<text class="mut sm" x="105.0" y="282" text-anchor="middle">W (axis 1)</text><text class="mut sm" x="20" y="185.0" text-anchor="middle" transform="rotate(-90 20 185.0)">H (axis 0)</text><text class="mut sm" x="230.0" y="247.6" transform="rotate(-37 230.0 247.6)">bands (axis 2)</text>
<text class="fg b mono" x="360" y="28">axes=(0, 1, 2)</text>
<text class="mut sm" x="360" y="46">spatial &#215; spectral windows</text>
<polygon points="360,110 432.0,56.0 582.0,56.0 510,110" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.08"/><polygon points="510,110 582.0,56.0 582.0,206.0 510,260" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.05"/><polygon points="360,110 510,110 510,260 360,260" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.12"/>
<polygon points="360,110 384.0,92.0 459.0,92.0 435.0,110" fill="#9c27b0" stroke="#9c27b0" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.39"/><polygon points="435.0,110 459.0,92.0 459.0,167.0 435.0,185.0" fill="#9c27b0" stroke="#9c27b0" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.25"/><polygon points="360,110 435.0,110 435.0,185.0 360,185.0" fill="#9c27b0" stroke="#9c27b0" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.55"/>
<text class="mut sm" x="435.0" y="282" text-anchor="middle">W (axis 1)</text><text class="mut sm" x="350" y="185.0" text-anchor="middle" transform="rotate(-90 350 185.0)">H (axis 0)</text><text class="mut sm" x="560.0" y="247.6" transform="rotate(-37 560.0 247.6)">bands (axis 2)</text>
</svg>
