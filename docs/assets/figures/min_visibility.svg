<svg class="plk-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-label="min_visibility">
<title>min_visibility</title>
<style>
.fg{fill:var(--md-default-fg-color,#222)}
.mut{fill:var(--md-default-fg-color--light,#666)}
.ln{stroke:var(--md-default-fg-color--light,#666);fill:none}
.bg{fill:var(--md-default-fg-color--lightest,#eee)}
text{font-family:var(--md-text-font-family,sans-serif);font-size:14px}
.sm{font-size:12px}.b{font-weight:700}.mono{font-family:var(--md-code-font-family,monospace)}
</style>
<text class="fg b mono" x="20" y="24">min_visibility=1.0 (default)</text>
<rect x="20" y="40" width="200" height="160" rx="3" fill="#009688" fill-opacity=".15" stroke="#009688" stroke-width="3"/><text class="b" x="28" y="190" fill="#009688">tile</text>
<rect x="160" y="90" width="100" height="60" fill="none" stroke="#fbc02d" stroke-width="2" stroke-dasharray="5 4"/>
<text x="190" y="128" text-anchor="middle" font-size="22" fill="#e53935">✘</text><text class="mut sm" x="20" y="230">dropped: only 60% of the box is inside</text>
<text class="fg b mono" x="350" y="24">min_visibility=0.5</text>
<rect x="350" y="40" width="200" height="160" rx="3" fill="#009688" fill-opacity=".15" stroke="#009688" stroke-width="3"/><text class="b" x="358" y="190" fill="#009688">tile</text>
<rect x="490" y="90" width="100" height="60" fill="none" stroke="#fbc02d" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="490" y="90" width="60" height="60" fill="#fbc02d" fill-opacity=".45" stroke="#fbc02d" stroke-width="3"/>
<text x="520" y="128" text-anchor="middle" font-size="22" fill="#43a047">✔</text><text class="mut sm" x="350" y="230">kept and clipped to the tile border</text>
</svg>
